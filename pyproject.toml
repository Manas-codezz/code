[project]
name = "brandguard"
version = "0.1.0"
description = "BrandGuard AI — brand compliance review engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "openai",
    "pillow",
    "python-multipart",
    "python-dotenv",
    "bcrypt>=5.0.0",
    "pyjwt>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
